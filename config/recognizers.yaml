# Presidio & Custom Regex Recognizer Configuration for EcoChain Copilot

recognizers:
  - name: "PriceRecognizer"
    supported_entity: "PRICE"
    supported_language: "en"
    patterns:
      - name: "currency_with_amount"
        regex: '(?i)(?:EUR|USD|GBP|€|\$|£)\s*\d+(?:\.\d{2})?(?:\s*(?:\/|\bper\b)\s*(?:kg|meter|m|unit|piece|item))?'
        score: 0.95
      - name: "amount_with_currency_suffix"
        regex: '(?i)\d+(?:\.\d{2})?\s*(?:EUR|USD|GBP|€|\$|£)(?:\s*(?:\/|\bper\b)\s*(?:kg|meter|m|unit|piece|item))?'
        score: 0.95

  - name: "IBANRecognizer"
    supported_entity: "IBAN_CODE"
    supported_language: "en"
    patterns:
      - name: "international_iban"
        regex: '\b[A-Z]{2}\d{2}[A-Za-z0-9]{11,30}\b'
        score: 1.0

  - name: "SupplierIdRecognizer"
    supported_entity: "SUPPLIER_ID"
    supported_language: "en"
    patterns:
      - name: "supplier_prefix_pattern"
        regex: '\bSUP(?:PLIER)?[-_]?[A-Z0-9]{3,8}\b'
        score: 0.90

  - name: "FacilityIdRecognizer"
    supported_entity: "FACILITY_ID"
    supported_language: "en"
    patterns:
      - name: "facility_prefix_pattern"
        regex: '\bFAC(?:ILITY)?[-_]?[A-Z0-9]{3,8}\b'
        score: 0.90

  - name: "PhoneRecognizer"
    supported_entity: "PHONE_NUMBER"
    supported_language: "en"
    patterns:
      - name: "international_phone"
        regex: '(?:\+?\d{1,3}[-.\s]?)?\(?\d{2,4}\)?[-.\s]?\d{3,4}[-.\s]?\d{3,4}\b'
        score: 0.85
